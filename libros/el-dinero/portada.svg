  <text x="452" y="494" text-anchor="middle" font-family="Georgia, serif" font-size="66" font-weight="bold" fill="#6b4a0e">€</text>
  <g transform="translate(150,488) rotate(-25)">
    <ellipse cx="0" cy="0" rx="44" ry="34" fill="#0b100e" opacity=".4" transform="translate(5,7)"/>
    <ellipse cx="0" cy="0" rx="44" ry="34" fill="url(#dn-p-concha)" stroke="#8a7650" stroke-width="2"/>
    <path d="M-34,2 q34,-10 68,0 q-34,6 -68,0 z" fill="#5a4a2c"/>
    <g stroke="#6d5c3a" stroke-width="2"><line x1="-22" y1="-4" x2="-22" y2="4"/><line x1="-10" y1="-5" x2="-10" y2="4"/><line x1="2" y1="-5" x2="2" y2="4"/><line x1="14" y1="-5" x2="14" y2="4"/><line x1="25" y1="-4" x2="25" y2="4"/></g>
    <ellipse cx="-12" cy="-16" rx="14" ry="5" fill="#fff" opacity=".35"/>
