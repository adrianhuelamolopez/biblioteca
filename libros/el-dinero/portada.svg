    <rect x="400" y="284" width="22" height="160"/><rect x="392" y="272" width="38" height="14"/><rect x="392" y="442" width="38" height="14"/>
  </g>
  <path d="M160,320 C176,296 204,344 220,320 L220,346 C204,370 176,322 160,346 Z" fill="#b3261e" fill-opacity=".85" stroke="#6e1712" stroke-width="1.5"/>
