    <circle cx="520" cy="140" r="16" fill="url(#dn-p-oro)"/>
    <circle cx="70" cy="500" r="18" fill="url(#dn-p-plata)"/>
  </g>
  <!-- real de a ocho -->
  <circle cx="300" cy="335" r="175" fill="#0b100e" opacity=".5" transform="translate(8,10)"/>
