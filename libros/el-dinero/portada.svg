  <rect x="14" y="14" width="572" height="872" fill="none" stroke="#c9a54a" stroke-width="3"/>
  <rect x="26" y="26" width="548" height="848" fill="none" stroke="#c9a54a" stroke-width="1.2"/>
  <text x="300" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="6" fill="#e2c46a">ECONOMÍA</text>
  <text x="300" y="660" text-anchor="middle" font-family="Georgia, serif" font-size="82" font-weight="bold" fill="#f3efe4">El dinero</text>
  <line x1="200" y1="690" x2="400" y2="690" stroke="#c9a54a" stroke-width="1.5"/>
  <text x="300" y="730" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-style="italic" fill="#e3dccb">De las conchas al euro,</text>
  <text x="300" y="764" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-style="italic" fill="#e3dccb">la historia de una idea</text>
  <text x="300" y="850" text-anchor="middle" font-family="Georgia, serif" font-size="18" letter-spacing="5" fill="#b9ab86">BIBLIOTECA</text>
</svg>
