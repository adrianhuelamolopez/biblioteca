<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="dn-p-fondo" cx="50%" cy="36%" r="75%">
      <stop offset="0" stop-color="#26392f"/>
      <stop offset=".55" stop-color="#15201b"/>
      <stop offset="1" stop-color="#0b100e"/>
    </radialGradient>
    <radialGradient id="dn-p-plata" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#f4f4ef"/>
      <stop offset=".45" stop-color="#bfc3c2"/>
      <stop offset="1" stop-color="#6d7372"/>
    </radialGradient>
    <radialGradient id="dn-p-oro" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#fbe7a4"/>
      <stop offset=".5" stop-color="#d9a83f"/>
      <stop offset="1" stop-color="#8a6116"/>
