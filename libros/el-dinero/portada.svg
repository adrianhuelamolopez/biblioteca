    <radialGradient id="dn-p-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e2c46a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#e2c46a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dn-p-concha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3df"/>
      <stop offset="1" stop-color="#c9b48a"/>
    </linearGradient>
    <path id="dn-p-arco" d="M160,335 A140,140 0 0 1 440,335"/>
  </defs>
  <rect width="600" height="900" fill="url(#dn-p-fondo)"/>
  <circle cx="300" cy="335" r="260" fill="url(#dn-p-halo)"/>
