  <circle cx="300" cy="335" r="175" fill="none" stroke="#e8e8e2" stroke-width="3"/>
  <circle cx="300" cy="335" r="158" fill="none" stroke="#5d6362" stroke-width="2" stroke-dasharray="3 5"/>
  <text font-family="Georgia, serif" font-size="24" letter-spacing="5" fill="#4a504f"><textPath href="#dn-p-arco" startOffset="50%" text-anchor="middle">VTRAQUE · VNUM</textPath></text>
  <!-- mares -->
  <path d="M205,455 q16,-9 32,0 q16,9 32,0 q16,-9 32,0 q16,9 32,0 q16,-9 32,0 q16,9 32,0" fill="none" stroke="#4d6f8c" stroke-width="3"/>
